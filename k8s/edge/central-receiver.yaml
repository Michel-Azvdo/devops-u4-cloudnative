# Receptor da central: recebe os eventos que o no de borda sincroniza
apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-receiver
  namespace: cloudnative-u4
  labels:
    app: central-receiver
    part-of: u4-cloudnative
spec:
  replicas: 1
  selector:
    matchLabels:
      app: central-receiver
  template:
    metadata:
      labels:
        app: central-receiver
        part-of: u4-cloudnative
    spec:
      containers:
        - name: central-receiver
          image: michelazevedo/u4-central-receiver:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: central-receiver
  namespace: cloudnative-u4
  labels:
    app: central-receiver
spec:
  type: ClusterIP
  selector:
    app: central-receiver
  ports:
    - name: http
      port: 5000
      targetPort: 5000