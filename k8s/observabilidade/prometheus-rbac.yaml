# Permissao para o Prometheus descobrir pods no cluster
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observabilidade-u4
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-u4
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-u4
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-u4
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observabilidade-u4