name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Job 1: constroi e publica as imagens dos dois servicos
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [servico-dados, servico-cliente]
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          # v1 = versao estavel; sha = tag unica deste commit (rastreabilidade)
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/u4-${{ matrix.service }}:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/u4-${{ matrix.service }}:${{ github.sha }}

  # Job 2: sobe um cluster temporario e aplica os manifestos
  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Criar cluster Kubernetes temporario (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: u4-ci

      - name: Usar a imagem exata deste commit nos manifestos
        run: sed -i "s|:v1|:${{ github.sha }}|" k8s/servico-dados/deployment.yaml k8s/servico-cliente/deployment.yaml

      - name: Aplicar manifestos com kustomize
        run: kubectl apply -k k8s

      - name: Esperar os deployments ficarem prontos
        run: |
          kubectl rollout status deployment/servico-dados -n cloudnative-u4 --timeout=180s
          kubectl rollout status deployment/servico-cliente -n cloudnative-u4 --timeout=180s

      - name: Testar o servico cliente dentro do cluster
        run: |
          kubectl run teste-curl --rm -i --restart=Never -n cloudnative-u4 \
            --image=curlimages/curl -- curl -s http://servico-cliente:5000/cliente

      - name: Mostrar o estado final
        run: kubectl get pods,svc -n cloudnative-u4